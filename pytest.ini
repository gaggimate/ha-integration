[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
# Parallel by default (tests are independent: random loopback ports, no shared state).
# Serial run: pytest -n0. 4 workers is the sweet spot on a 4-core runner (ubuntu-latest).
addopts = -n 4
markers =
    frames(name): select the fake-server fixture frames from tests/fixtures/frames (default single_boiler_idle)
